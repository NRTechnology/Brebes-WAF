#
# =============================================================================
# BREBES-WAF
# Category  : Git
# Function  : Block Exposed Git Repository
# Version   : 1.0
# Author    : Brebes CSIRT
# Rule ID   : 6001001
#
# Description:
# Blocks HTTP requests attempting to access exposed Git repositories.
#
# Protected path:
#   .git/
#
# Examples:
#   /.git/
#   /.git/config
#   /.git/HEAD
#   /.git/index
#   /.git/logs/
#   /.git/objects/
#   /.git/refs/
#
# URL encoding variants are normalized before inspection.
#
# =============================================================================

SecRule REQUEST_URI \
"@rx (?:^|/)\.git(?:/|$)" \
"id:6001001,\
rev:'1',\
ver:'BREBES-WAF/1.0',\
phase:1,\
deny,\
status:403,\
log,\
auditlog,\
severity:'CRITICAL',\
accuracy:'10',\
maturity:'10',\
tag:'brebes-waf',\
tag:'git',\
tag:'git-protection',\
tag:'information-disclosure',\
logdata:'Matched %{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
msg:'BREBES-WAF | Git | Blocked Git Repository Access',\
t:urlDecodeUni,\
t:lowercase"
