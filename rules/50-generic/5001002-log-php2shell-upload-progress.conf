#
# =============================================================================
# BREBES-WAF
# Category  : Generic
# Signature : PHP2Shell Session Upload Progress
# Function  : Detection and Logging
# Version   : 1.0
# Author    : Brebes CSIRT
# Rule ID   : 5001002
#
# Description:
# Logs requests containing the default PHP session upload progress field.
#
# Required Parameters:
#   PHP_SESSION_UPLOAD_PROGRESS
#
# Notes:
#   Detection and logging only. Not a substitute for patching PHP.
# =============================================================================

SecRule ARGS_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" \
"id:5001002,\
rev:'1',\
ver:'BREBES-WAF/1.0',\
phase:2,\
pass,\
log,\
auditlog,\
severity:'WARNING',\
accuracy:'10',\
maturity:'10',\
tag:'brebes-waf',\
tag:'generic',\
tag:'php2shell',\
tag:'session-upload-progress',\
msg:'BREBES-WAF | PHP2Shell | Session Upload Progress | Suspicious Request Detected'"