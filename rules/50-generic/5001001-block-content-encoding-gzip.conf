#
# =============================================================================
# BREBES-WAF
# Category  : Generic
# Function  : Block Response Content-Encoding gzip
# Version   : 1.0
# Author    : Brebes CSIRT
# Rule ID   : 5001001
#
# Description:
# Detects HTTP responses whose Content-Encoding header is set to gzip.
#
# This rule blocks responses that contain:
#
#   Content-Encoding: gzip
#
# The rule operates on response headers and is intended to prevent
# gzip-encoded responses from being returned to the client.
#
# Required Parameters:
#   RESPONSE_HEADERS:Content-Encoding = Response Content-Encoding header
#
# Detection:
#   gzip
# =============================================================================

SecRule RESPONSE_HEADERS:Content-Encoding "@rx ^(?i:gzip)$" \
"id:5001001,\
rev:'1',\
ver:'BREBES-WAF/1.0',\
phase:3,\
deny,\
status:403,\
log,\
auditlog,\
severity:'WARNING',\
accuracy:'10',\
maturity:'10',\
tag:'brebes-waf',\
tag:'generic',\
tag:'response-header',\
tag:'content-encoding',\
tag:'blocked-content-encoding',\
logdata:'Matched %{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
msg:'BREBES-WAF | Generic | Block Response Content-Encoding gzip'"
