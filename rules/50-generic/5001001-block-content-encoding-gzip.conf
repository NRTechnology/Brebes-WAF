#
# =============================================================================
# BREBES-WAF
# Category  : Generic
# Function  : Log Response Content-Encoding gzip
# Version   : 1.1
# Author    : Brebes CSIRT
# Rule ID   : 5001001
#
# Description:
# Logs HTTP responses whose Content-Encoding header is gzip.
# The response is allowed and is not blocked by this rule.
# =============================================================================

SecRule RESPONSE_HEADERS:Content-Encoding "@rx ^(?i:gzip)$" \
"id:5001001,\
rev:'2',\
ver:'BREBES-WAF/1.0',\
phase:3,\
pass,\
log,\
auditlog,\
severity:'WARNING',\
accuracy:'10',\
maturity:'10',\
tag:'brebes-waf',\
tag:'generic',\
tag:'response-header',\
tag:'content-encoding',\
tag:'allowed-content-encoding',\
logdata:'Matched %{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
msg:'BREBES-WAF | Generic | Response Content-Encoding gzip Detected'"