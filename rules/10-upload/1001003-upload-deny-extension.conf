#
# =============================================================================
# BREBES-WAF
# Category  : Upload
# Function  : Block Disallowed File Extensions
# Version   : 2.0
# Author    : Brebes CSIRT
# Rule ID   : 1001003
#
# Description:
# Blocks uploaded files whose extensions are not included in the
# BREBES-WAF allowed upload extension whitelist.
#
# Empty MULTIPART_FILENAME values are ignored to prevent false positives
# generated by multipart/form-data requests containing non-file fields
# or empty file inputs.
#
# Required Parameters:
#   MULTIPART_FILENAME = Uploaded filename
#
# Allowed Extensions:
#
#   Images:
#     - png
#     - jpg
#     - jpeg
#     - webp
#
#   Documents:
#     - pdf
#     - txt
#     - rtf
#     - doc
#     - docx
#     - odt
#
#   Spreadsheets:
#     - xls
#     - xlsx
#     - csv
#     - ods
#
#   Presentations:
#     - ppt
#     - pptx
#     - odp
#
# Logic:
#
#   1. Inspect MULTIPART_FILENAME.
#   2. Ignore empty filename values.
#   3. Store the matched non-empty filename in MATCHED_VAR.
#   4. Check that filename against the allowed extension whitelist.
#   5. Deny the request with HTTP 403 when the extension is not allowed.
#
# Examples:
#
#   Allowed:
#     foto.jpeg
#     foto aku.jpeg
#     laporan.pdf
#     data.xlsx
#     presentasi.pptx
#
#   Blocked:
#     shell.php
#     backdoor.phtml
#     malware.exe
#     script.sh
#     payload.phar
#
# Revision History:
#
#   rev 1:
#     Initial implementation.
#
#   rev 2:
#     Ignore empty MULTIPART_FILENAME values and use MATCHED_VAR
#     in the chained extension validation to prevent false positives.
#
# =============================================================================

SecRule MULTIPART_FILENAME "!@rx ^$" \
"id:1001003,\
rev:'2',\
ver:'BREBES-WAF/1.0',\
phase:2,\
deny,\
status:403,\
log,\
auditlog,\
severity:'CRITICAL',\
accuracy:'10',\
maturity:'10',\
tag:'brebes-waf',\
tag:'upload',\
tag:'blocked-extension',\
logdata:'Matched %{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
msg:'BREBES-WAF | Upload | Disallowed File Extension',\
chain"

    SecRule MATCHED_VAR "!@rx \.(?i:(png|jpg|jpeg|webp|pdf|txt|rtf|doc|docx|odt|xls|xlsx|csv|ods|ppt|pptx|odp))$"
    