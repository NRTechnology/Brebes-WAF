#
# =============================================================================
# BREBES-WAF
# Category  : Upload
# Function  : Block POST multipart/form-data with Excessive Arguments
# Version   : 1.1
# Author    : Brebes CSIRT
# Rule ID   : 1001004
#
# Description:
# Blocks POST multipart/form-data requests containing 100 or more
# parsed request arguments.
#
# Detection Logic:
#   1. Check HTTP method POST.
#   2. Check Content-Type multipart/form-data.
#   3. Count parsed request arguments.
#   4. Deny with HTTP 403 if argument count >= 100.
#
# Revision History:
#   rev 1: Initial logging-only implementation.
#   rev 2: Block excessive multipart arguments with HTTP 403.
#
# =============================================================================

SecRule REQUEST_METHOD "@streq POST" \
    "id:1001004,\
    rev:'2',\
    ver:'BREBES-WAF/1.1',\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,\
    severity:'WARNING',\
    accuracy:'10',\
    maturity:'10',\
    tag:'brebes-waf',\
    tag:'upload',\
    tag:'multipart-form-data',\
    tag:'excessive-arguments',\
    msg:'BREBES-WAF | Upload | Excessive Multipart Arguments Detected',\
    chain"

    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?:\s*;|$)" \
        "t:none,chain"

        SecRule &ARGS "@ge 100" \
            "t:none,logdata:'Argument count=%{MATCHED_VAR}'"