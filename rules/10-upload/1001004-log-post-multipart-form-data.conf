
#
# =============================================================================
# BREBES-WAF
# Category  : Upload
# Function  : Log POST multipart/form-data Requests
# Version   : 1.0
# Author    : Brebes CSIRT
# Rule ID   : 1001004
#
# Description:
# Logs POST requests using the multipart/form-data content type.
#
# This rule is intended for monitoring multipart/form-data requests,
# including requests containing a large number of form fields.
#
# The request is allowed and is not blocked by this rule.
#
# Required Parameters:
#   REQUEST_METHOD                 = HTTP request method
#   REQUEST_HEADERS:Content-Type   = HTTP Content-Type header
#
# Detection Logic:
#
#   1. Check that the request method is POST.
#   2. Inspect the Content-Type request header.
#   3. Match multipart/form-data, including an optional boundary parameter.
#   4. Log the matching request to the ModSecurity log and audit log.
#   5. Allow the request to continue without blocking.
#
# Examples:
#
#   Matched:
#     POST /upload HTTP/1.1
#     Content-Type: multipart/form-data; boundary=----ExampleBoundary
#
#   Not Matched:
#     GET /upload HTTP/1.1
#     Content-Type: multipart/form-data; boundary=----ExampleBoundary
#
#     POST /api HTTP/1.1
#     Content-Type: application/json
#
# Revision History:
#
#   rev 1:
#     Initial implementation for monitoring POST multipart/form-data
#     requests without blocking them.
#
# =============================================================================

SecRule REQUEST_METHOD "@streq POST" \
    "id:1001004,\
    rev:'1',\
    ver:'BREBES-WAF/1.0',\
    phase:1,\
    pass,\
    log,\
    auditlog,\
    t:none,\
    severity:'NOTICE',\
    accuracy:'10',\
    maturity:'10',\
    tag:'brebes-waf',\
    tag:'upload',\
    tag:'multipart-form-data',\
    logdata:'Method=%{REQUEST_METHOD}; Content-Type=%{MATCHED_VAR}',\
    msg:'BREBES-WAF | Upload | POST multipart/form-data Detected',\
    chain"

    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?:\s*;|$)" \
        "t:none"

